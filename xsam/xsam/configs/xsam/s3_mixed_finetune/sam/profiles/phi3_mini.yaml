profile_name: phi3_mini
llm_name: Phi-3-mini-4k-instruct
prompt_template: phi3_chat
max_length: 2319
enable_4bit_llm: false
s1_pretrained_relpath: null
s2_pretrained_relpath: null
segmentor_trunk_mode: full_ft
segmentor_fpn_mode: full_ft
segmentor_lora_rank: 16
segmentor_lora_alpha: 32
segmentor_lora_dropout: 0.05
segmentor_lora_bias: none
segmentor_lora_target_modules: null
image_processor: siglip_image
llm_attn_implementation: eager
batch_size: 4
accumulative_counts: 1
dataloader_num_workers: 4
max_epochs: 1
lr: 4.0e-5
betas: [0.9, 0.999]
weight_decay: 0.05
max_norm: 1.0
warmup_ratio: 0.03
save_steps: 2000
save_total_limit: 2
logging_interval: 10
evaluation_freq: 2000
