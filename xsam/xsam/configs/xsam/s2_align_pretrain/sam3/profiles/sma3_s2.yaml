profile_name: sam3_align_s2

# Model init
llm_name: Phi-3-mini-4k-instruct
seg_encoder_name: sam3
sam3_encoder_trunk: sam3_encoder.bin
sam3_simple_fpn: sam3_fpn.bin
s1_pretrained_relpath:
  encoder_trunk_relpath: runs/s1_seg_finetune/xsam_sam3_1008_e12_gpu2_seg_finetune/sam3_encoder.bin
  fpn_relpath: runs/s1_seg_finetune/xsam_sam3_1008_e12_gpu2_seg_finetune/sam3_fpn.bin
s2_pretrained_relpath: null

# Data
data_relpath: llava/LLaVA-Pretrain/blip_laion_cc_sbu_558k.json
image_folder_relpath: llava/LLaVA-Pretrain/558k_images
prompt_template: phi3_chat
max_length: 2319
image_size: 1008
evaluation_image: ./data/imgconv_data/llava/LLaVA-Pretrain/558k_images/00001/000015879.jpg

# Train policy
freeze_llm: true
enable_lora: false
segmentor_trunk_mode: freeze
segmentor_fpn_mode: freeze
segmentor_lora_rank: 16
segmentor_lora_alpha: 32
segmentor_lora_dropout: 0.05
segmentor_lora_bias: none
segmentor_lora_target_modules: null
lang_bast_layers: [-12]
seg_bast_layers: [-12]
lang_downsample_ratio: 0.5
seg_downsample_ratio: 0.5
projector_depth: 2
use_activation_checkpointing: false

# Runtime
enable_4bit_llm: true
batch_size: 2
accumulative_counts: 64
dataloader_num_workers: 8
persistent_workers: true
prefetch_factor: 4
pin_memory: true
max_epochs: 0.25
lr: 5.0e-4
betas: [0.9, 0.999]
weight_decay: 0.0
max_norm: 1.0
warmup_ratio: 0.03
save_steps: 2000
save_total_limit: 2
logging_interval: 10
evaluation_freq: 2000
